name: build

# Compile both firmware environments on every push and pull request.
# This is a build check only - it never uploads or releases (releases stay
# local via scripts/release.py). Its main value: contributor PRs are verified
# automatically before review, and no commit can silently break the build.

on:
  push:
    # Work branches build too, not just the trunks: without them a regression
    # can sit in a branch unbuilt until someone opens a PR (that is exactly how
    # #113 slipped through). One prefix per area - prnt/ printer, slcr/ slicer,
    # cliv/ Connect Live; 0.17/** is the old scheme and retires with 0.17.
    # claude/** is where cloud sessions push. They cannot run PlatformIO at all,
    # so without this line their firmware changes are compiled by nobody until a
    # PR exists. GitHub reads this file from the branch being pushed to, so the
    # rule only covers cloud branches cut after it reaches main.
    branches: [ main, experimental, 'prnt/**', 'slcr/**', 'cliv/**', 'claude/**', 'codex/**', '0.17/**' ]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # platformio.ini pins build_dir to a Windows path (C:/PIO-build/...) to
      # keep build output off the dev machine's Google Drive. Override it here
      # so the Linux runner uses a normal in-workspace directory.
      PLATFORMIO_BUILD_DIR: .pio/build
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      # Synthetic fixtures and inert API adapters only. These checks need no
      # browser, downloaded model, external slicer, key, or physical printer.
      - name: Studio and PC bridge regressions
        timeout-minutes: 5
        run: |
          node scripts/dev/test_start_flow.cjs
          node scripts/dev/test_api_start_retry.cjs
          node scripts/dev/test_preflight_busy_native.cjs
          node scripts/dev/test_model_library.mjs
          node scripts/dev/test_finished_product_library.cjs
          node scripts/dev/test_product_save_race.cjs
          node scripts/dev/test_sculpt_dimensions.cjs
          node scripts/dev/test_slicer_fit_gate.cjs
          node scripts/dev/test_slicer_import_wait.cjs
          node scripts/dev/test_topper_meshy.cjs
          node scripts/dev/test_topper_pending_actions.cjs
          node scripts/dev/test_keycap_texture.cjs
          node scripts/dev/test_texture_lifecycle.cjs
          node scripts/dev/test_texture_backup.cjs
          node scripts/dev/test_keycap_autofinish.cjs
          node scripts/dev/test_keycap_autofinish_integration.cjs
          node scripts/dev/test_artisan_review.cjs
          node scripts/dev/test_meshy_revision.cjs
          node scripts/dev/test_artisan_delivery.cjs
          node scripts/dev/test_color_backup.cjs
          node scripts/dev/test_includes.mjs
          python -m unittest discover -s scripts/tests -p 'test_tm_send*.py' -v

      - name: Cache PlatformIO
        uses: actions/cache@v4
        with:
          path: |
            ~/.platformio
            .pio
          key: pio-${{ runner.os }}-${{ hashFiles('platformio.ini') }}
          restore-keys: pio-${{ runner.os }}-

      - name: Install PlatformIO
        run: pip install --upgrade platformio

      # Run the existing native firmware tests before the slow builds. If the
      # SemVer comparison or firmware-URL guard regressed, fail early.
      - name: Unit tests (native)
        run: pio test -e native

      - name: Build both environments
        run: pio run

      # CONTRIBUTING requires the network-free build to keep compiling; flip
      # the switch the same way a developer would and build the USB env.
      - name: Build the network-free firmware (ENABLE_NETWORK 0)
        run: |
          sed -i 's/#define ENABLE_NETWORK\([[:space:]]*\)1/#define ENABLE_NETWORK\10/' src/TinyMaker.ino
          grep -n "define ENABLE_NETWORK" src/TinyMaker.ino
          pio run -e tinymaker
          git checkout -- src/TinyMaker.ino
