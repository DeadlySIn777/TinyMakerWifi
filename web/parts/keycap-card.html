<!-- Keycaps.
     The point of the card is that you are making the thing instead of buying
     it, so the cap is photographed rather than diagrammed and the picker is
     built out of caps rather than out of buttons.

     Several ideas here came out of a design pass and survived an adversarial
     one; they are marked KEPT where they sit. -->
<section id='kcCard' class='card'>
  <div class='cardHead'>
    <h2>Keycaps</h2>
    <span id='kcState' class='hint'></span>
  </div>

  <ol id='kcSteps' class='kcSteps'>
    <li data-step='1' class='on'>Key</li>
    <li data-step='2'>Shape</li>
    <li data-step='3'>Art</li>
    <li data-step='4'>Print</li>
  </ol>

  <!-- ---- step 1: the board is the hero -------------------------------- -->
  <div class='kcPane' data-pane='1'>
    <!-- KEPT, and given something real to measure: the jaws open to how much
         of the 40.8 mm bed this cap eats, so the tool answers the question the
         bed actually asks rather than restating the cap's width. -->
    <div class='kcCal' id='kcCal' style='--jaw:.44'>
      <i class='kcJawA'></i><i class='kcJawB'></i>
      <span class='kcCalBed'>40.8 mm bed</span>
      <b id='kcJawVal'>18.00 mm</b>
    </div>

    <div id='kcBoard' class='kcBoard'></div>

    <div class='kcKeyLegend'>
      <span><i class='kcSw'></i>prints flat</span>
      <span><i class='kcSw t'></i>prints leaning, with supports</span>
      <span><i class='kcSw n'></i>will not fit the bed</span>
    </div>
  </div>

  <!-- ---- steps 2-4 ----------------------------------------------------- -->
  <div class='kcPane' data-pane='2 3 4' hidden>
    <div class='kcSplit'>
      <div class='kcStageWrap'>
        <!-- KEPT: a seamless sweep - one gradient, no horizon, no floor plane -
             with the canvas transparent on top, so the cap is photographed
             rather than boxed. -->
        <div class='kcStage'>
          <canvas id='kcTop' width='420' height='420'
            aria-label='the cap in 3D - drag to turn it'></canvas>
          <span class='kcSpin'>drag to turn</span>
          <div class='kcPose' id='kcPose'>
            <button type='button' data-pose='made' class='on'>Made</button>
            <button type='button' data-pose='printed'>Printed</button>
          </div>
        </div>
        <div id='kcDims' class='kcDims'></div>
        <div class='kcInsets'>
          <figure><canvas id='kcFlat' width='200' height='200'
            aria-label='the legend, seen straight down'></canvas><figcaption>legend</figcaption></figure>
          <figure><canvas id='kcSide' width='200' height='120'
            aria-label='the cap seen from the front'></canvas><figcaption>section</figcaption></figure>
        </div>
      </div>

      <div class='kcOptions'>
        <div class='kcGroup' data-for='2'>
          <p class='kcLbl'>Profile</p>
          <div id='kcProfiles' class='kcTiles'></div>
          <p id='kcProfileNote' class='hint'></p>
          <p class='kcLbl'>Row</p>
          <div id='kcRows' class='kcTiles sm'></div>
        </div>

        <!-- One choice, then only what that choice needs. This step used to
             show four unrelated ways of making art at once - a prompt, ten
             drawn icons, a Braille field and a finish row - stacked down the
             card with a paragraph of explanation on top. -->
        <div class='kcGroup' data-for='3' hidden>
          <div class='kcModes' id='kcModes'>
            <button type='button' data-mode='gen' class='on'>Generate</button>
            <button type='button' data-mode='lib'>Library</button>
            <button type='button' data-mode='braille'>Braille</button>
            <button type='button' data-mode='none'>Plain</button>
          </div>

          <div data-art='gen'>
            <textarea id='kcPrompt' rows='3' maxlength='500'
              placeholder='a military IFAK pouch with a medical cross patch'></textarea>
            <div class='calRow'>
              <button id='kcGen' type='button' style='flex:2 1 160px'>Generate</button>
              <button id='kcGenClear' class='button secondary' type='button'
                style='flex:1 1 90px' disabled>Clear</button>
            </div>
            <p id='kcGenNote' class='hint'></p>
          </div>

          <div data-art='lib' hidden>
            <div id='kcShelf' class='kcShelf'></div>
            <p id='kcShelfNote' class='hint'></p>
            <details class='kcAdv'>
              <summary>Built-in shapes</summary>
              <div id='kcIcons' class='kcTiles sm'></div>
            </details>
          </div>

          <div data-art='braille' hidden>
            <div class='calRow'>
              <input id='kcBraille' maxlength='2' placeholder='a' class='kcMono'>
              <span class='hint' style='flex:1 1 160px;margin:0'>one letter or one
                digit &mdash; a 1u top holds two cells</span>
            </div>
          </div>

          <!-- Overrides. Nothing in here has to be touched: the engine picks
               a depth and a finish from what the art IS - Braille is fixed by
               specification, a sculpt needs real depth, a legend engraves
               better - and only stops deciding once you change something. -->
          <details class='kcAdv'>
            <summary>Advanced</summary>
          <div class='kcFinishBar'>
            <div class='kcSeg' id='kcFinish'>
              <input type='checkbox' id='kcRaised' checked hidden>
              <button type='button' data-raised='1' class='on'>Raised</button>
              <button type='button' data-raised='0'>Engraved</button>
            </div>
            <label class='kcNum grow'><span>Relief</span>
              <input id='kcDepth' type='range' min='0.15' max='6' step='0.05' value='0.55'>
              <b id='kcDepthVal'>0.55</b></label>
            <label class='kcNum'><span>Corner</span>
              <input id='kcDigit' maxlength='1' placeholder='&mdash;' class='kcMono'></label>
          </div>
          </details>
          <p id='kcLegendWarn' class='hint'></p>
        </div>

        <div class='kcGroup' data-for='4' hidden>
          <div id='kcReport' class='kcReport'></div>
          <div class='calRow'>
            <button id='kcAdd' class='button secondary' type='button' style='flex:1 1 130px'>Add to plate</button>
            <button id='kcSlice' type='button' style='flex:2 1 150px'>Send to slicer</button>
          </div>
          <div class='calRow'>
            <button id='kcShare' class='button secondary' type='button' style='flex:1 1 130px'
              title='A picture of the cap plus a code that rebuilds it exactly - send it to whoever has to approve it'>Share for approval</button>
            <button id='kcStl' class='button secondary' type='button' style='flex:1 1 110px'>Export STL</button>
          </div>
          <div class='calRow'>
            <button id='kcPaint' class='button secondary' type='button' style='flex:1 1 130px'
              title='The top of the cap straight down, big, for painting from'>Paint guide</button>
            <button id='kcComb' class='button secondary' type='button' style='flex:1 1 130px'
              title='A row of stems, each slot wider than the last. Print it once and keep the one that clicks.'>Stem fit test</button>
          </div>
          <p id='kcPlate' class='hint'></p>
          <details class='kcOpen'>
            <summary>Open a shared design</summary>
            <div class='calRow'>
              <input id='kcCode' placeholder='paste a design code' class='kcCodeIn'>
              <button id='kcLoad' class='button secondary' type='button' style='flex:0 0 90px'>Load</button>
            </div>
            <p id='kcCodeNote' class='hint'></p>
          </details>
        </div>

        <div class='kcNav'>
          <button id='kcBack' class='button secondary' type='button'>Back</button>
          <button id='kcNext' type='button'>Next</button>
        </div>
      </div>
    </div>
  </div>
</section>

<style>
/* Every colour resolves through a token that exists in BOTH themes. The cap
   tones are literals per theme rather than mixes of adjacent surface tokens:
   --btnsec over --tile INVERTS in light mode (the face ends up darker than the
   skirt) and --card over --bg differs by half a percent of luminance in dark,
   which is invisible. Depth here comes from the lip and the drop, not the
   fill - measured, not assumed. */
/* Everything below sizes off the CARD, not the viewport. That distinction is
   the whole fix: this card can be handed 1100 px of a desktop or 500 px of a
   side column on the SAME screen, so a viewport media query gets it wrong
   either way. cqw is 1% of the card's own width, so it is right in both.
   Nothing has a fixed pixel size that matters; every number is a clamp with a
   floor for a phone and a ceiling so a 5K display does not inflate it. */
/* #homeView is a two-column grid, so any child of it gets half of the 1100 px
   page column. This card needs the whole width: it carries a 15-unit keyboard
   and a stage that sits beside its controls, and at 543 px it got neither -
   the keys came out 27 px wide and the desktop layout never engaged. */
#kcCard{grid-column:1/-1}
#kcCard{container-type:inline-size;container-name:kc}
#kcCard{--kSkirt:#0f1116;--kFace:#1b1f27;--kLip:#333a47;--kWell:#07080a;
  --kPlate:#0a0b0e;--kDrop:rgba(0,0,0,.55);--kSweep:#191d25;--kFloor:#0a0c10}
[data-theme=light] #kcCard{--kSkirt:#c5ccd7;--kFace:#fff;--kLip:#fff;--kWell:#ccd3dc;
  --kPlate:#dfe4ea;--kDrop:rgba(23,30,44,.20);--kSweep:#f4f6f9;--kFloor:#dde2e9}

/* one rule, and it is most of why the card stops reading as a form: if it is a
   word it is tracked uppercase, if it is a number it is tabular mono */
#kcCard .kcLbl{margin:clamp(13px,1.7cqw,24px) 0 clamp(6px,.8cqw,11px);
  font:600 clamp(10px,1.05cqw,14px)/1 ui-sans-serif,system-ui,sans-serif;
  letter-spacing:.11em;text-transform:uppercase;color:var(--subh)}
#kcCard .kcGroup>.kcLbl:first-child{margin-top:0}
#kcCard .kcMono,#kcCard .kcDims,#kcCard .kcReport dd,#kcCard .kcCal b,#kcCard .kcNum b{
  font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-variant-numeric:tabular-nums}

#kcCard .kcSteps{display:flex;gap:2px;list-style:none;margin:0 0 15px;padding:0;
  border-bottom:1px solid var(--line)}
#kcCard .kcSteps li{padding:clamp(8px,1cqw,14px) clamp(10px,1.5cqw,22px);cursor:pointer;
  color:var(--muted2);
  font:600 clamp(11px,1.15cqw,16px)/1 ui-sans-serif,system-ui,sans-serif;letter-spacing:.08em;
  text-transform:uppercase;border-bottom:2px solid transparent;margin-bottom:-1px;
  transition:color .14s,border-color .14s}
#kcCard .kcSteps li:hover{color:var(--text)}
#kcCard .kcSteps li.on{color:var(--text);border-bottom-color:var(--accent)}
#kcCard .kcSteps li.done{color:var(--muted)}

/* ---- the caliper ------------------------------------------------------- */
#kcCard .kcCal{position:relative;height:clamp(28px,3.2cqw,46px);
  margin:0 2px clamp(10px,1.2cqw,18px);border-bottom:1px solid var(--line2)}
#kcCard .kcCal i{position:absolute;bottom:0;width:1px;height:14px;background:var(--muted2)}
#kcCard .kcCal i::after{content:'';position:absolute;bottom:0;width:7px;height:1px;background:var(--muted2)}
#kcCard .kcJawA{left:0}#kcCard .kcJawA::after{left:0}
#kcCard .kcJawB{left:calc(var(--jaw)*100%);transition:left .25s cubic-bezier(.2,.7,.3,1)}
#kcCard .kcJawB::after{right:0}
#kcCard .kcCal b{position:absolute;bottom:calc(50% - .2em);left:calc(var(--jaw)*50%);
  transform:translateX(-50%);font-size:clamp(11px,1.15cqw,17px);color:var(--text);white-space:nowrap;transition:left .25s cubic-bezier(.2,.7,.3,1)}
#kcCard .kcCalBed{position:absolute;right:0;bottom:2px;font:600 10px/1 ui-sans-serif,system-ui;
  letter-spacing:.1em;text-transform:uppercase;color:var(--ink3)}

/* ---- the board: caps, not buttons -------------------------------------- */
#kcCard .kcBoard{display:flex;flex-direction:column;gap:clamp(3px,.55cqw,8px);
  padding:clamp(9px,1.3cqw,20px) clamp(8px,1.1cqw,18px) clamp(11px,1.5cqw,22px);
  border-radius:clamp(8px,1cqw,14px);background:var(--kPlate);border:1px solid var(--line);
  overflow-x:auto}
#kcCard .kcRow{display:flex;gap:clamp(3px,.45cqw,7px)}
/* unit widths as flex, so a row summing to 15u fills any container with no
   arithmetic and no media queries on the board */
#kcCard .kcKey{position:relative;flex:var(--u,1) 0 0;min-width:0;
  height:clamp(30px,3.5cqw,62px);border:0;padding:0;
  cursor:pointer;background:var(--kSkirt);border-radius:5px 5px 6px 6px;
  box-shadow:0 2px 3px var(--kDrop);transition:box-shadow .08s}
/* the top face, inset so five pixels of skirt survive along the bottom edge -
   that exposed skirt is the whole reason these read as caps and not buttons */
#kcCard .kcKey::before{content:'';position:absolute;
  inset:clamp(2px,.22cqw,4px) clamp(2px,.22cqw,4px) clamp(5px,.55cqw,9px);
  border-radius:3px 3px 4px 4px;
  background:var(--kFace);box-shadow:inset 0 1px 0 var(--kLip);transition:inset .08s,background .12s}
#kcCard .kcKey span{position:relative;z-index:1;display:flex;align-items:center;
  justify-content:center;height:100%;padding:0 3px;
  font:600 clamp(9px,1.05cqw,16px)/1 ui-sans-serif,system-ui,sans-serif;color:var(--muted);
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;transition:color .12s}
#kcCard .kcKey:hover span{color:var(--text)}
/* selecting PRESSES the cap: it sits down on the plate rather than floating */
#kcCard .kcKey:active::before,#kcCard .kcKey.sel::before{
  inset:clamp(4px,.5cqw,8px) clamp(2px,.22cqw,4px) clamp(3px,.3cqw,5px)}
#kcCard .kcKey:active,#kcCard .kcKey.sel{box-shadow:0 1px 1px var(--kDrop)}
#kcCard .kcKey.sel::before{background:var(--accent);box-shadow:inset 0 1px 0 rgba(255,255,255,.25)}
#kcCard .kcKey.sel span{color:#fff}
/* leaning: a machining hatch on the face. It stays a whole cap, because it IS
   printable - it just leans over and takes supports. */
#kcCard .kcKey.tilt::before{background:var(--kFace) repeating-linear-gradient(135deg,
  var(--warn-soft) 0 3px,transparent 3px 7px)}
#kcCard .kcKey.tilt span{color:var(--warncol)}
/* impossible: the cap is simply NOT THERE - an empty switch socket with a lit
   cross stem in it. Absence carries the information, and anyone who has ever
   pulled a keycap reads it in under a second. */
#kcCard .kcKey.no{background:var(--kWell);box-shadow:inset 0 2px 5px var(--kDrop);cursor:not-allowed}
#kcCard .kcKey.no::before{display:none}
#kcCard .kcKey.no::after{content:'';position:absolute;left:50%;top:50%;width:13px;height:13px;
  transform:translate(-50%,-50%);
  background:linear-gradient(var(--line2),var(--line2)) center/3px 100% no-repeat,
             linear-gradient(var(--line2),var(--line2)) center/100% 3px no-repeat}
#kcCard .kcKey.no span{color:var(--ink3);font-size:clamp(8px,.85cqw,13px);letter-spacing:.05em}
#kcCard .kcKey.no:hover span{color:var(--ink3)}

#kcCard .kcKeyLegend{display:flex;flex-wrap:wrap;gap:clamp(12px,2cqw,26px);
  margin-top:clamp(10px,1.3cqw,18px);font-size:clamp(11px,1.15cqw,15px);color:var(--muted)}
#kcCard .kcKeyLegend span{display:flex;align-items:center;gap:8px}
#kcCard .kcSw{position:relative;width:clamp(16px,1.8cqw,26px);height:clamp(13px,1.45cqw,21px);
  flex:0 0 auto;background:var(--kSkirt);
  border-radius:3px 3px 4px 4px;box-shadow:0 1px 2px var(--kDrop)}
#kcCard .kcSw::before{content:'';position:absolute;inset:1px 1px 3px;border-radius:2px;
  background:var(--kFace);box-shadow:inset 0 1px 0 var(--kLip)}
#kcCard .kcSw.t::before{background:var(--kFace) repeating-linear-gradient(135deg,
  var(--warn-soft) 0 3px,transparent 3px 7px)}
#kcCard .kcSw.n{background:var(--kWell);box-shadow:inset 0 1px 3px var(--kDrop)}
#kcCard .kcSw.n::before{display:none}
#kcCard .kcSw.n::after{content:'';position:absolute;left:50%;top:50%;width:8px;height:8px;
  transform:translate(-50%,-50%);
  background:linear-gradient(var(--line2),var(--line2)) center/2px 100% no-repeat,
             linear-gradient(var(--line2),var(--line2)) center/100% 2px no-repeat}

/* ---- the stage --------------------------------------------------------- */
#kcCard .kcSplit{display:grid;grid-template-columns:1fr;
  gap:clamp(14px,2.4cqw,30px);align-items:start}
@container kc (min-width:700px){
  #kcCard .kcSplit{grid-template-columns:minmax(0,1.25fr) minmax(0,1fr)}}
/* A browser without container queries falls back to the window, which is right
   whenever the card is the full width of the page - which it now is. */
@supports not (container-type:inline-size){
  @media (min-width:820px){
    #kcCard .kcSplit{grid-template-columns:minmax(0,1.25fr) minmax(0,1fr)}}}
#kcCard .kcStage{position:relative;aspect-ratio:1;border-radius:clamp(10px,1.3cqw,18px);
  overflow:hidden;
  border:1px solid var(--line);
  background:radial-gradient(128% 74% at 50% 99%,var(--kSweep),var(--kFloor) 64%)}
#kcCard .kcStage::after{content:'';position:absolute;inset:0;pointer-events:none;z-index:2;
  background:radial-gradient(78% 62% at 50% 44%,transparent 42%,var(--kDrop))}
#kcCard #kcTop{position:absolute;inset:0;width:100%;height:100%;display:block;
  cursor:grab;touch-action:none;z-index:1}
#kcCard #kcTop:active{cursor:grabbing}
#kcCard .kcPose{position:absolute;right:11px;top:11px;z-index:3;display:flex;
  border:1px solid var(--line2);border-radius:8px;overflow:hidden;
  background:color-mix(in srgb,var(--pv) 78%,transparent)}
@supports not (background:color-mix(in srgb,red 50%,transparent)){
  #kcCard .kcPose{background:var(--pv)}}
#kcCard .kcPose button{border:0;width:auto;flex:0 0 auto;padding:6px 11px;white-space:nowrap;background:transparent;color:var(--muted2);
  cursor:pointer;font:600 10px/1 ui-sans-serif,system-ui;letter-spacing:.09em;text-transform:uppercase}
#kcCard .kcPose button.on{background:var(--accent-soft);color:var(--text)}
#kcCard .kcSpin{position:absolute;left:13px;bottom:11px;z-index:3;pointer-events:none;
  font:600 10px/1 ui-sans-serif,system-ui;letter-spacing:.11em;text-transform:uppercase;color:var(--ink3)}
#kcCard .kcDims{margin-top:clamp(8px,1cqw,15px);font-size:clamp(11.5px,1.2cqw,16px);color:var(--muted)}
#kcCard .kcInsets{display:grid;grid-template-columns:1fr 1fr;
  gap:clamp(8px,1cqw,16px);margin-top:clamp(9px,1.1cqw,16px)}
#kcCard .kcInsets figure{margin:0}
#kcCard .kcInsets canvas{width:100%;height:auto;display:block;border-radius:9px;
  background:var(--kFloor);border:1px solid var(--line)}
#kcCard .kcInsets figcaption{margin-top:5px;font:600 10px/1 ui-sans-serif,system-ui;
  letter-spacing:.11em;text-transform:uppercase;color:var(--ink3)}

/* ---- controls ---------------------------------------------------------- */
#kcCard .kcTiles{display:grid;gap:clamp(6px,.8cqw,11px);
  grid-template-columns:repeat(auto-fill,minmax(clamp(76px,9cqw,124px),1fr))}
#kcCard .kcTiles.sm{grid-template-columns:repeat(auto-fill,minmax(clamp(62px,7cqw,104px),1fr))}
#kcCard .kcTile{padding:clamp(8px,1cqw,15px) 7px;border:1px solid var(--line);
  border-radius:9px;background:var(--tile);color:var(--muted);cursor:pointer;text-align:center;
  font:600 clamp(11.5px,1.2cqw,16px)/1.3 ui-sans-serif,system-ui,sans-serif;
  transition:border-color .12s,color .12s}
#kcCard .kcTile:hover{border-color:var(--line2);color:var(--text)}
#kcCard .kcTile.on{border-color:var(--accent);background:var(--accent-soft);color:var(--text)}
#kcCard .kcTile small{display:block;margin-top:3px;font-weight:400;font-size:10.5px;color:var(--ink3)}
#kcCard #kcPrompt{width:100%;box-sizing:border-box;background:var(--tile);color:var(--text);
  border:1px solid var(--line2);border-radius:9px;padding:10px;font:inherit;resize:vertical}
#kcCard #kcPrompt:focus{outline:0;border-color:var(--accent)}
#kcCard .kcNum{display:flex;align-items:center;gap:8px;flex:0 1 auto}
#kcCard .kcNum.grow{flex:1 1 180px}
#kcCard .kcNum>span{font:600 10px/1 ui-sans-serif,system-ui;letter-spacing:.1em;
  text-transform:uppercase;color:var(--subh)}
#kcCard .kcNum input[type=range]{flex:1;min-width:70px;accent-color:var(--accent)}
#kcCard .kcNum b{min-width:36px;text-align:right;font-size:12.5px;color:var(--text)}
#kcCard input.kcMono{width:54px;text-align:center;background:var(--tile);color:var(--text);
  border:1px solid var(--line2);border-radius:8px;padding:8px 6px;font-size:13px;
  font-family:ui-monospace,Menlo,Consolas,monospace}
/* Your own work, newest first. Thumbnails are what you actually recognise a
   design by - a list of prompts all starting "a military..." is not a shelf. */
#kcCard .kcShelf{display:grid;gap:clamp(7px,.9cqw,12px);
  grid-template-columns:repeat(auto-fill,minmax(clamp(92px,11cqw,150px),1fr))}
#kcCard .kcShelfItem{position:relative;border:1px solid var(--line);border-radius:10px;
  background:var(--tile);cursor:pointer;overflow:hidden;text-align:left;padding:0;width:auto;
  transition:border-color .12s}
#kcCard .kcShelfItem:hover{border-color:var(--line2)}
#kcCard .kcShelfItem.on{border-color:var(--accent)}
#kcCard .kcShelfItem img{display:block;width:100%;aspect-ratio:1;object-fit:cover;
  background:var(--kFloor)}
#kcCard .kcShelfItem b{display:block;padding:7px 8px 3px;color:var(--text);
  font:600 clamp(10.5px,1.05cqw,13px)/1.25 ui-sans-serif,system-ui;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#kcCard .kcShelfItem small{display:block;padding:0 8px 8px;color:var(--ink3);
  font-size:clamp(9.5px,.95cqw,12px)}
#kcCard .kcShelfDel{position:absolute;top:5px;right:5px;width:auto;min-width:0;margin:0;
  padding:3px 7px;border:0;border-radius:6px;background:var(--overlay);color:var(--muted);
  font:600 11px/1 ui-sans-serif,system-ui;cursor:pointer;opacity:0;transition:opacity .12s}
#kcCard .kcShelfItem:hover .kcShelfDel{opacity:1}
#kcCard .kcShelfDel:hover{color:var(--dangertxt)}
#kcCard .kcAdv{margin-top:clamp(12px,1.5cqw,20px);border-top:1px solid var(--line);
  padding-top:clamp(9px,1.1cqw,15px)}
#kcCard .kcAdv summary{cursor:pointer;font:600 clamp(10px,1.05cqw,14px)/1 ui-sans-serif,system-ui;
